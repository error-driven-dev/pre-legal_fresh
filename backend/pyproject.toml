[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal V1 backend (FastAPI + SQLite)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140",
    "httpx>=0.28.1",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
